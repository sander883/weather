# Polymarket Weather Trading Agent Configuration

# Weather Data Collection
weather:
  sources:
    - name: openweathermap
      enabled: true
      api_key: OPENWEATHERMAP_API_KEY
      base_url: https://api.openweathermap.org/data/2.5
      free_tier: true
      endpoints:
        - weather
        - forecast

    - name: weatherapi
      enabled: true
      api_key: WEATHERAPI_KEY
      base_url: https://api.weatherapi.com/v1
      free_tier: true
      endpoints:
        - current
        - forecast

  locations:
    - name: New York
      lat: 40.7128
      lon: -74.0060
      country: US
      timezone: America/New_York

    - name: Los Angeles
      lat: 34.0522
      lon: -118.2437
      country: US
      timezone: America/Los_Angeles

    - name: London
      lat: 51.5074
      lon: -0.1278
      country: GB
      timezone: Europe/London

  refresh_interval: 3600  # seconds
  historical_lookback: 30  # days

# Feature Engineering
features:
  lookback_windows:
    - 3h
    - 6h
    - 12h
    - 24h

  aggregations:
    - mean
    - std
    - min
    - max
    - trend

  seasonal_features: true
  include_nan_imputation: true
  imputation_method: forward_fill

# Machine Learning Model
model:
  algorithm: xgboost
  target_variable: rain_probability

  xgboost_params:
    max_depth: 6
    learning_rate: 0.05
    n_estimators: 300
    subsample: 0.8
    colsample_bytree: 0.8
    objective: binary:logistic
    eval_metric: auc
    random_state: 42

  train_test_split: 0.8
  validation_split: 0.1
  cross_validation_folds: 5

  retrain_interval: 604800  # 7 days in seconds
  min_samples_for_retrain: 1000

# Market Mapping
market_mapping:
  data_source: ./config/markets.json
  auto_discovery: true
  discovery_interval: 86400  # 24 hours

  market_filters:
    - keywords:
        - rain
        - precipitation
        - weather
    - types:
        - categorical
        - binary

  confidence_threshold: 0.65
  min_market_liquidity: 100  # minimum USD in market

# Trading Strategy
trading:
  strategy: probability_edge

  edge_threshold: 0.05  # 5% probability edge required

  position_sizing:
    method: kelly  # kelly or fixed
    kelly_fraction: 0.25  # use 25% of Kelly
    fixed_size_percent: 2.0  # 2% of capital per trade

  entry_conditions:
    - edge_requirement: true
      min_liquidity: 500
      max_slippage: 0.02

  exit_conditions:
    - profit_target: 0.20  # 20% profit
    - stop_loss: -0.10  # 10% loss
    - time_based: 86400  # close after 24h if no fill

  max_concurrent_positions: 5
  min_position_size: 10  # USD
  max_position_size: 1000  # USD

# Risk Management
risk_management:
  portfolio:
    initial_capital: 10000
    max_daily_loss_percent: 2.0
    max_drawdown_percent: 10.0
    max_leverage: 1.0

  position:
    max_risk_per_trade: 0.02  # 2% of capital
    max_concentration: 0.30  # 30% of capital in one market
    max_correlation: 0.70  # correlation threshold

  circuit_breaker:
    daily_loss_threshold: 0.05  # stop after 5% daily loss
    max_consecutive_losses: 5
    cooldown_period: 3600  # 1 hour

  emergency_shutdown:
    enabled: true
    triggers:
      - api_failures: 10
      - risk_limit_breached: true
      - connectivity_loss: 300  # seconds

# Learning Loop
learning:
  enabled: true

  feedback:
    collection: true
    storage: database
    retention_days: 365

  retraining:
    schedule: weekly
    trigger_conditions:
      model_age: 604800  # 7 days
      accuracy_drop: 0.05  # 5% drop
      new_samples: 500

  hyperparameter_tuning:
    enabled: true
    method: bayesian
    n_trials: 50
    seed: 42

# Polymarket API
polymarket:
  api_url: https://api.polymarket.com
  ws_url: wss://ws.polymarket.com

  network:
    chain_id: 137  # Polygon
    rpc_endpoint: https://polygon-rpc.com

  order_book_update_interval: 5  # seconds
  price_update_interval: 1  # seconds

  order_execution:
    slippage_tolerance: 0.02  # 2%
    max_order_age: 300  # 5 minutes
    retry_on_failure: true
    max_retries: 3

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/agent.log
  max_file_size: 10485760  # 10MB
  backup_count: 5
  console_output: true

# Dashboard
dashboard:
  enabled: true
  host: 0.0.0.0
  port: 5000
  debug: false
  update_interval: 5  # seconds

  features:
    - predictions
    - open_positions
    - trade_history
    - pnl_analytics
    - model_metrics
    - risk_dashboard

# Notifications
notifications:
  enabled: true
  channels:
    - type: console
      enabled: true

    - type: file
      enabled: true
      path: logs/notifications.log

    - type: email
      enabled: false
      smtp_server: smtp.gmail.com
      smtp_port: 587
      from_address: agent@example.com

    - type: slack
      enabled: false
      webhook_url: ${SLACK_WEBHOOK_URL}

# Performance Monitoring
monitoring:
  enabled: true

  metrics:
    - prediction_accuracy
    - win_rate
    - profit_factor
    - sharpe_ratio
    - max_drawdown
    - recovery_factor

  export_interval: 3600
  export_format: json

# Backtest Configuration
backtest:
  enabled: false
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  initial_capital: 10000
  commission: 0.001  # 0.1%
  slippage: 0.005  # 0.5%
